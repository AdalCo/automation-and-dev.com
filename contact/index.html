<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact — Automation & Development</title>
    <meta name="description" content="Get in touch for custom CAD automation tools, mobile app development, or to discuss a project.">
    <link rel="icon" type="image/png" href="../tracksmart/favicon.png">
    <link rel="apple-touch-icon" href="../tracksmart/favicon.png">
    <!-- Open Graph -->
    <meta property="og:title" content="Contact — Automation & Development">
    <meta property="og:description" content="Get in touch for custom CAD automation tools, mobile app development, or to discuss a project.">
    <meta property="og:url" content="https://automation-and-dev.com/contact/">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary">
    <link rel="stylesheet" href="../shared/base.css">
    <style>
        /* Form section */
        .form-section {
            padding: 0 0 100px;
            position: relative;
            z-index: 1;
        }
        .form-card {
            padding: 48px;
            max-width: 600px;
            margin: 0 auto;
        }
        .form-card h2 {
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 28px;
        }

        /* Light mode */
        @media (prefers-color-scheme: light) {
            .form-card {
                box-shadow: 0 4px 24px rgba(0,0,0,0.05), 0 12px 40px rgba(0,0,0,0.03);
            }
        }

        /* Responsive */
        @media (max-width: 640px) {
            .form-card { padding: 28px; }
        }
    </style>
</head>
<body>
    <!-- Floating gradient orbs -->
    <div class="bg-glow">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <nav>
        <div class="container">
            <a href="../" class="logo">Automation &amp; Development</a>
            <input type="checkbox" id="nav-toggle" class="nav-toggle">
            <label for="nav-toggle" class="nav-hamburger" aria-label="Menu">
                <span></span><span></span><span></span>
            </label>
            <div class="nav-links">
                <a href="../#services">Services</a>
                <a href="../portfolio/">Portfolio</a>
                <a href="../about/">About</a>
                <a href="../contact/" class="active">Contact</a>
            </div>
        </div>
    </nav>

    <section class="hero reveal">
        <div class="container">
            <h1><span class="gradient">Get in Touch</span></h1>
        </div>
    </section>

    <section class="form-section">
        <div class="container">
            <div class="form-card glass-card-strong reveal">
                <h2>Send a Message</h2>
                <form id="contact-form" action="https://formspree.io/f/xykbbrzn" method="POST">
                    <input type="text" name="_gotcha" style="display:none" tabindex="-1" autocomplete="off">
                    <div class="form-group">
                        <label for="name">Name</label>
                        <input type="text" id="name" name="name" placeholder="Your name" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="you@example.com" required>
                    </div>
                    <div class="form-group">
                        <label for="subject">Subject</label>
                        <select id="subject" name="subject">
                            <option value="CAD Automation">CAD Automation</option>
                            <option value="App Development">App Development</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="message">Message</label>
                        <textarea id="message" name="message" placeholder="Tell me about your project..." required></textarea>
                    </div>
                    <button type="submit" class="badge primary submit-btn">Send Message</button>
                    <div id="form-status" class="form-status"></div>
                </form>
                <script src="../shared/form-handler.js"></script>
                <script>initFormHandler('contact-form', "Message sent! I'll get back to you soon.", 'Send Message');</script>
            </div>
        </div>
    </section>

    <footer>
        <div class="container">
            <p>&copy; 2026 Automation &amp; Development</p>
            <div class="footer-links">
                <a href="../portfolio/">Portfolio</a>
                <a href="../about/">About</a>
                <a href="../contact/">Contact</a>
            </div>
        </div>
    </footer>

    <script src="../shared/reveal.js"></script>
</body>
</html>
