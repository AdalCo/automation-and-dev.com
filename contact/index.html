<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact — Automation & Development</title>
    <meta name="description" content="Get in touch for custom CAD automation tools, mobile app development, or to discuss a project.">
    <link rel="icon" type="image/png" href="../tracksmart/favicon.png">
    <link rel="apple-touch-icon" href="../tracksmart/favicon.png">
    <!-- Open Graph -->
    <meta property="og:title" content="Contact — Automation & Development">
    <meta property="og:description" content="Get in touch for custom CAD automation tools, mobile app development, or to discuss a project.">
    <meta property="og:url" content="https://automation-and-dev.com/contact/">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary">
    <link rel="stylesheet" href="../shared/base.css">
    <style>
        /* Hero */
        .hero {
            text-align: center;
            padding: 100px 0 60px;
            position: relative;
            z-index: 1;
        }
        .hero h1 {
            font-size: clamp(2.5rem, 6vw, 3.8rem);
            font-weight: 700;
            letter-spacing: -0.03em;
            line-height: 1.1;
            margin-bottom: 16px;
        }
        .hero h1 .gradient {
            background: linear-gradient(135deg, var(--indigo-from), var(--indigo-to));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .hero p {
            font-size: 1.15rem;
            color: var(--text-secondary);
            max-width: 520px;
            margin: 0 auto;
        }

        /* Contact section */
        .contact {
            padding: 0 0 72px;
            position: relative;
            z-index: 1;
        }
        .contact-card {
            padding: 48px;
            max-width: 600px;
            margin: 0 auto;
        }
        .contact-info {
            margin-bottom: 36px;
        }
        .contact-info p {
            font-size: 1rem;
            color: var(--text-secondary);
            line-height: 1.7;
            margin-bottom: 16px;
        }
        .contact-info a {
            color: var(--blue);
            text-decoration: none;
            font-weight: 500;
        }
        .contact-info a:hover { text-decoration: underline; }
        .email-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 16px;
            font-size: 1.05rem;
        }
        .email-icon {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, var(--indigo-from), var(--indigo-to));
            box-shadow: 0 4px 16px rgba(38,51,204,0.25);
        }

        /* Form section */
        .form-section {
            padding: 0 0 100px;
            position: relative;
            z-index: 1;
        }
        .form-card {
            padding: 48px;
            max-width: 600px;
            margin: 0 auto;
        }
        .form-card h2 {
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 28px;
        }

        /* Orb configuration */
        .bg-glow .orb-1 {
            width: 600px; height: 600px;
            background: radial-gradient(circle, rgba(38,51,204,0.25), transparent 70%);
            top: -200px; left: -100px;
            animation: drift1 20s ease-in-out infinite;
        }
        .bg-glow .orb-2 {
            width: 500px; height: 500px;
            background: radial-gradient(circle, rgba(89,64,204,0.2), transparent 70%);
            top: 400px; right: -150px;
            animation: drift2 25s ease-in-out infinite;
        }
        .bg-glow .orb-3 {
            width: 400px; height: 400px;
            background: radial-gradient(circle, rgba(0,122,255,0.12), transparent 70%);
            bottom: -100px; left: 30%;
            animation: drift3 22s ease-in-out infinite;
        }

        /* Light mode */
        @media (prefers-color-scheme: light) {
            .bg-glow .orb-1 { background: radial-gradient(circle, rgba(89,64,204,0.12), transparent 70%); }
            .bg-glow .orb-2 { background: radial-gradient(circle, rgba(38,51,204,0.08), transparent 70%); }
            .bg-glow .orb-3 { background: radial-gradient(circle, rgba(0,122,255,0.06), transparent 70%); }
            .contact-card, .form-card {
                box-shadow: 0 4px 24px rgba(0,0,0,0.05), 0 12px 40px rgba(0,0,0,0.03);
            }
            .email-icon {
                box-shadow: 0 4px 12px rgba(89,64,204,0.15);
            }
        }

        /* Responsive */
        @media (max-width: 640px) {
            .hero { padding: 80px 0 48px; }
            .contact-card, .form-card { padding: 28px; }
        }
    </style>
</head>
<body>
    <!-- Floating gradient orbs -->
    <div class="bg-glow">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <nav>
        <div class="container">
            <a href="../" class="logo" style="font-size:1.1rem;font-weight:600;letter-spacing:-0.02em;text-decoration:none;color:var(--text);">Automation &amp; Development</a>
            <div class="nav-links">
                <a href="../">Home</a>
            </div>
        </div>
    </nav>

    <section class="hero reveal">
        <div class="container">
            <h1><span class="gradient">Get in Touch</span></h1>
            <p>Let's talk about your next project.</p>
        </div>
    </section>

    <section class="contact">
        <div class="container">
            <div class="contact-card glass-card-strong reveal">
                <div class="contact-info">
                    <div class="email-row">
                        <div class="email-icon circle-icon">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
                        </div>
                        <a href="mailto:autoanddev@gmail.com">autoanddev@gmail.com</a>
                    </div>
                    <p>Whether you need a custom CAD automation tool, a mobile app, or want to discuss a project — reach out.</p>
                </div>
            </div>
        </div>
    </section>

    <section class="form-section">
        <div class="container">
            <div class="form-card glass-card-strong reveal">
                <h2>Send a Message</h2>
                <form id="contact-form" action="https://formspree.io/f/xykbbrzn" method="POST">
                    <input type="text" name="_gotcha" style="display:none" tabindex="-1" autocomplete="off">
                    <div class="form-group">
                        <label for="name">Name</label>
                        <input type="text" id="name" name="name" placeholder="Your name" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="you@example.com" required>
                    </div>
                    <div class="form-group">
                        <label for="subject">Subject</label>
                        <select id="subject" name="subject">
                            <option value="CAD Automation">CAD Automation</option>
                            <option value="App Development">App Development</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="message">Message</label>
                        <textarea id="message" name="message" placeholder="Tell me about your project..." required></textarea>
                    </div>
                    <button type="submit" class="badge primary submit-btn">Send Message</button>
                    <div id="form-status" class="form-status"></div>
                </form>
                <script>
                    document.getElementById('contact-form').addEventListener('submit', async function(e) {
                        e.preventDefault();
                        const btn = this.querySelector('.submit-btn');
                        const status = document.getElementById('form-status');
                        btn.disabled = true;
                        btn.textContent = 'Sending...';
                        status.className = 'form-status';
                        status.style.display = 'none';
                        try {
                            const res = await fetch('https://formspree.io/f/xykbbrzn', {
                                method: 'POST',
                                headers: { 'Accept': 'application/json' },
                                body: new FormData(this)
                            });
                            if (res.ok) {
                                status.textContent = 'Message sent! I\'ll get back to you soon.';
                                status.className = 'form-status success';
                                this.reset();
                            } else {
                                throw new Error();
                            }
                        } catch {
                            status.textContent = 'Something went wrong. Please try again.';
                            status.className = 'form-status error';
                        }
                        status.style.display = '';
                        btn.disabled = false;
                        btn.textContent = 'Send Message';
                        setTimeout(() => {
                            status.style.transition = 'opacity 1s ease';
                            status.style.opacity = '0';
                            setTimeout(() => {
                                status.style.display = 'none';
                                status.style.opacity = '1';
                                status.style.transition = '';
                            }, 1000);
                        }, 4000);
                    });
                </script>
            </div>
        </div>
    </section>

    <footer>
        <div class="container">
            <p>&copy; 2026 Automation &amp; Development</p>
            <div class="footer-links">
                <a href="../">Home</a>
            </div>
        </div>
    </footer>

    <!-- Scroll-triggered reveal -->
    <script>
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('visible');
                    observer.unobserve(entry.target);
                }
            });
        }, { threshold: 0.15 });
        document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
    </script>
</body>
</html>
